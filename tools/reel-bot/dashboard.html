<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Bot</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1c1a; --muted:#6f6b64; --line:#e6e3dc;
  --accent:#d9622b; --accent-ink:#fff; --soft:#f1efe9;
  --ok:#2f8a4f; --warn:#b7791f; --bad:#c2412d; --info:#2f6fb5;
  --ok-bg:#e5f3e9; --warn-bg:#fbf0dc; --bad-bg:#fbe6e2; --info-bg:#e3edf8;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141412; --panel:#1d1c1a; --ink:#ecebe7; --muted:#9b978f; --line:#2e2d2a;
  --accent:#ef7a43; --soft:#252421;
  --ok:#5cc07d; --warn:#e0a84a; --bad:#ef6f5a; --info:#6aa5e8;
  --ok-bg:#1e3326; --warn-bg:#3a2e18; --bad-bg:#3b211c; --info-bg:#1c2b3d;
  --shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
header h1 span{color:var(--accent)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--soft);font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.dot.pulse{animation:p 1.4s infinite}
@keyframes p{50%{opacity:.35}}
.spacer{flex:1}
main{display:grid;grid-template-columns:360px 1fr;gap:18px;padding:18px 22px;max-width:1500px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr;padding:14px 16px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0;padding:12px 14px 8px;font-weight:600}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.tabs{display:flex;gap:4px;padding:0 14px}
.tab{border:0;background:none;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--soft);color:var(--ink);font-weight:600}
.form{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
input[type=text],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:disabled{opacity:.5;cursor:default}
.jobs{display:flex;flex-direction:column;padding:4px 6px 8px}
.job{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 8px;border-radius:9px;cursor:pointer;border-bottom:1px solid var(--line)}
.job:last-child{border-bottom:0}
.job:hover{background:var(--soft)}
.job.sel{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.job .top{display:flex;gap:8px;align-items:center}
.job .name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.job .req{color:var(--muted);font-size:12.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.job .meta{color:var(--muted);font-size:11.5px;margin-top:4px;display:flex;gap:8px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;text-transform:capitalize}
.s-done{background:var(--ok-bg);color:var(--ok)}
.s-running{background:var(--info-bg);color:var(--info)}
.s-queued{background:var(--soft);color:var(--muted)}
.s-limit,.s-stopped{background:var(--warn-bg);color:var(--warn)}
.s-failed,.s-cancelled,.s-declined{background:var(--bad-bg);color:var(--bad)}
.s-approval{background:var(--accent);color:var(--accent-ink)}
.gl{padding:2px 14px 12px}.gr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.gr:last-child{border-bottom:0}
.approve{margin-top:14px;padding:12px 14px;border-radius:9px;background:var(--warn-bg);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{height:4px;background:var(--soft);border-radius:4px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.detail{padding:18px 20px}
.dh{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dh h3{margin:0;font-size:19px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.sub a{color:var(--accent);text-decoration:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.reqbox{margin-top:14px;padding:10px 12px;background:var(--soft);border-radius:9px;white-space:pre-wrap;font-size:13.5px}
.steps{display:flex;gap:0;margin:18px 0 6px;overflow-x:auto}
.step{flex:1;min-width:92px;position:relative;padding-top:20px;font-size:12px;color:var(--muted);text-align:center}
.step:before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:var(--line)}
.step:first-child:before{left:50%}.step:last-child:before{right:50%}
.step b{position:absolute;top:1px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--line)}
.step.done{color:var(--ink)}
.step.done:before{background:var(--accent)}
.step.done b{background:var(--accent);border-color:var(--accent)}
.step.now{color:var(--accent);font-weight:600}
.step.now b{border-color:var(--accent);animation:p 1.4s infinite}
.now-line{margin-top:10px;font-size:13px;color:var(--muted)}
.now-line strong{color:var(--ink);font-weight:550}
.section{margin-top:22px}
.section h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.vids{display:flex;gap:14px;flex-wrap:wrap}
.vid{width:220px}
.vid video{width:220px;aspect-ratio:9/16;background:#000;border-radius:10px;display:block}
.vid .t{font-weight:600;font-size:13px;margin-top:6px}
.vid .c{color:var(--muted);font-size:12px;margin-top:2px}
.copy{position:relative;background:var(--soft);border-radius:9px;padding:12px 14px;white-space:pre-wrap;font-size:13.5px}
.copy .btn{position:absolute;top:8px;right:8px;font-size:12px;padding:3px 9px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:13.5px}
.kv div:nth-child(odd){color:var(--muted)}
.log{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.li{display:flex;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.li:last-child{border-bottom:0}
.li .tm{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;width:52px}
.li .ic{flex:none;width:18px;text-align:center}
.li.say{background:color-mix(in srgb,var(--info-bg) 55%,transparent)}
.li .tx{white-space:pre-wrap;word-break:break-word;min-width:0}
.feed{max-height:360px;overflow:auto;padding:0 6px 8px}
.fe{padding:7px 8px;border-bottom:1px solid var(--line);font-size:12.5px}
.fe:last-child{border-bottom:0}
.fe .h{display:flex;gap:6px;color:var(--muted);font-size:11.5px}
.fe .x{margin-top:2px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pend{padding:10px 14px 14px;font-size:13px}
.empty{color:var(--muted);padding:40px 10px;text-align:center}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
.offline{background:var(--bad-bg);color:var(--bad);padding:8px 22px;font-size:13px;display:none}
</style>
</head>
<body>
<header>
  <h1>Reel <span>Bot</span></h1>
  <div class="pills" id="pills"></div>
  <div class="spacer"></div>
  <span class="pill" id="clock"></span>
</header>
<div class="offline" id="offline">Can't reach the bot. Is it running? (Terminal: <code>launchctl kickstart -k gui/$(id -u)/com.reelagents.reelbot</code>)</div>
<main>
  <div class="col">
    <div class="card">
      <h2>New request</h2>
      <div class="tabs"><button class="tab on" data-t="link">From a reel link</button><button class="tab" data-t="idea">From an idea</button></div>
      <div class="form">
        <input type="text" id="f-link" placeholder="https://www.instagram.com/reel/…">
        <textarea id="f-text" placeholder="Requirements: footage, mood, anything (e.g. use my trek footage, me in it)"></textarea>
        <div class="row">
          <select id="f-v" style="width:auto"><option value="">Versions: auto</option><option value="1">1 version</option><option value="2">2 versions</option></select>
          <div class="spacer"></div>
          <button class="btn primary" id="f-go">Queue build</button>
        </div>
      </div>
    </div>
    <div class="card" id="pend-card" style="display:none"><h2>Waiting for requirements</h2><div class="pend" id="pend"></div></div>
    <div class="card" id="guest-card" style="display:none"><h2>Friends</h2><div class="gl" id="guests"></div></div>
    <div class="card"><h2>Requests</h2><div class="jobs" id="jobs"></div></div>
    <div class="card"><h2>Activity</h2><div class="feed" id="feed"></div></div>
  </div>
  <div class="col">
    <div class="card detail" id="detail"><div class="empty">Pick a request on the left.</div></div>
  </div>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S=null, sel=null, mode="link", J=null, lastDetailKey="";
const SICON={approval:"👤",declined:"🚫",done:"✅",running:"⚙️",queued:"⏳",limit:"⏸️",stopped:"⏸️",failed:"❌",cancelled:"🛑"};
const SRC={telegram:"📱 You (Telegram)",dashboard:"🖥️ Dashboard",guest:"👤 Friend"};
const src=j=>j.source==="guest"?"👤 "+esc(j.who):(SRC[j.source]||esc(j.source));
const FEEDI={telegram:"📱",answer:"💬",job:"🔧",dashboard:"🖥️",guest:"👤"};

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600)}
function ago(iso){if(!iso)return"";const s=(Date.now()-new Date(iso))/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";return new Date(iso).toLocaleDateString([], {day:"numeric",month:"short"})}
function hm(iso){return iso?new Date(iso).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):""}
function title(j){return j.kind==="idea"?"💡 "+(j.requirements.split("\n")[0].slice(0,60)):"🎞️ "+j.code}
function pct(j){return j.state==="done"?100:Math.round(j.phase/(j.phases.length)*100)}

async function act(a){
  const r=await fetch("/api/action",{method:"POST",headers:{"Content-Type":"application/json","X-Reel-Bot":"1"},body:JSON.stringify(a)});
  const d=await r.json().catch(()=>({msg:"Error"}));toast(d.msg||"Done");refresh();if(sel)loadJob(sel,true);
}

async function refresh(){
  try{const r=await fetch("/api/state");S=await r.json();$("#offline").style.display="none"}
  catch(e){$("#offline").style.display="block";return}
  renderPills();renderJobs();renderPend();renderFeed();
  if(!sel&&S.jobs.length){sel=(S.jobs.find(j=>j.state==="running")||S.jobs[0]).id}
  if(sel)loadJob(sel);
}

function renderPills(){
  const L=S.live, cur=S.jobs.find(j=>j.id===L.current);
  let rate="";
  if(S.rate){const r=S.rate, at=r.resetsAt?new Date(r.resetsAt*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"";
    rate=r.status==="rejected"?`<span class="pill"><i class="dot bad"></i>Claude limit hit · resets ${at}</span>`:`<span class="pill"><i class="dot ok"></i>Claude OK</span>`}
  $("#pills").innerHTML=
    `<span class="pill"><i class="dot ok"></i>Bot online · since ${hm(S.bot_started)}</span>`+
    `<span class="pill"><i class="dot ${S.palmier?"ok":"warn"}"></i>PalmierPro ${S.palmier?"open":"closed"}</span>`+rate+
    (cur?`<span class="pill"><i class="dot ok pulse"></i>Building ${esc(cur.code||"idea")} · ${esc(cur.phases[Math.min(cur.phase,cur.phases.length-1)])}</span>`:`<span class="pill"><i class="dot"></i>Idle</span>`)+
    (L.queue.length?`<span class="pill">${L.queue.length} queued</span>`:"");
  $("#clock").textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}

function renderJobs(){
  if(!S.jobs.length){$("#jobs").innerHTML=`<div class="empty">No requests yet. Share a reel to the bot on Telegram.</div>`;return}
  $("#jobs").innerHTML=S.jobs.map(j=>`
    <button class="job ${j.id===sel?"sel":""}" data-id="${esc(j.id)}">
      <div class="top"><span class="name">${esc(title(j))}</span><span class="badge s-${j.state}">${esc(j.state)}</span></div>
      <div class="req">${esc(j.requirements)}</div>
      ${j.state==="running"?`<div class="bar"><i style="width:${pct(j)}%"></i></div>`:""}
      <div class="meta"><span>${src(j)}</span><span>${ago(j.created)}</span>${j.outputs.length?`<span>${j.outputs.length} video${j.outputs.length>1?"s":""}</span>`:""}</div>
    </button>`).join("");
  document.querySelectorAll(".job").forEach(b=>b.onclick=()=>{sel=b.dataset.id;renderJobs();loadJob(sel,true)});
}

function renderPend(){
  const ps=S.live.pending||[];$("#pend-card").style.display=ps.length?"block":"none";
  $("#pend").innerHTML=ps.map(p=>`<div style="margin-bottom:10px"><div>${p.who==="you"?"📱 You":"👤 "+esc(p.who)} · 🎞️ <a href="${esc(p.link)}" target="_blank" style="color:var(--accent)">${esc(p.code)}</a> · sends in ${Math.floor(p.starts_in/60)}:${String(p.starts_in%60).padStart(2,"0")}</div>
    <div class="reqbox" style="margin-top:8px">${esc((p.reqs||[]).join("\n")||"(no requirements yet)")}</div>
    <div class="row" style="margin-top:8px"><div class="spacer"></div><button class="btn primary" onclick="act({action:'go',chat:${Number(p.chat)}})">${p.who==="you"?"Start now":"Send for approval now"}</button></div></div>`).join("");
  const g=S.guests||[];$("#guest-card").style.display=g.length?"block":"none";
  $("#guests").innerHTML=g.map(x=>`<div class="gr"><span>👤 ${esc(x.name)}</span><span class="badge s-${x.status==="allowed"?"done":x.status==="blocked"?"failed":"approval"}">${x.status==="asked"?"wants access":esc(x.status)}</span><span class="spacer"></span>
    ${x.status!=="allowed"?`<button class="btn" onclick="act({action:'allow',guest:'${esc(x.id)}'})">Allow</button>`:""}${x.status!=="blocked"?`<button class="btn danger" onclick="act({action:'block',guest:'${esc(x.id)}'})">Block</button>`:""}</div>`).join("");
}

function renderFeed(){
  const ev=S.events||[];
  $("#feed").innerHTML=ev.length?ev.map(e=>`<div class="fe"><div class="h"><span>${FEEDI[e.kind]||"•"}</span><span>${esc(e.kind==="telegram"?"You on Telegram":e.kind==="answer"?"Bot answered":e.kind==="job"?"Job":e.kind==="guest"?(e.who?esc(e.who):"Friend"):"Dashboard")}</span><span class="spacer"></span><span>${hm(e.t)}</span></div><div class="x">${esc(e.text)}</div></div>`).join("")
    :`<div class="empty" style="padding:20px">Messages and job changes will show here.</div>`;
}

async function loadJob(id,force){
  try{const r=await fetch("/api/job?id="+encodeURIComponent(id));J=await r.json()}catch(e){return}
  if(J.error)return;
  const key=JSON.stringify([J.state,J.phase,J.steps.length,J.outputs,J.history.length]);
  if(!force&&key===lastDetailKey)return;   // don't reset playing videos
  lastDetailKey=key;renderDetail();
}

function renderDetail(){
  const j=J,res=j.result||{},running=j.state==="running",queued=j.state==="queued";
  const steps=j.phases.map((p,i)=>{const done=j.state==="done"||i<j.phase, now=running&&i===Math.min(j.phase,j.phases.length-1);
    return `<div class="step ${done&&!now?"done":""} ${now?"now":""}"><b></b>${esc(p)}</div>`}).join("");
  const last=[...j.steps].reverse().find(s=>s.k==="tool");
  const vids=(res.versions||[]).length?res.versions:j.outputs.map(f=>({file:f}));
  const copyText=[(res.caption||"").trim(),Array.isArray(res.keywords)?res.keywords.join(" · "):(res.keywords||""),(res.hashtags||[]).join(" ")].filter(Boolean).join("\n\n");
  $("#detail").innerHTML=`
    <div class="dh">
      <div><h3>${esc(title(j))}</h3>
        <div class="sub">${src(j)} · ${new Date(j.created).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
        ${j.link?` · <a href="${esc(j.link)}" target="_blank">original reel ↗</a>`:""} · ${j.versions||"?"} version(s)${j.cost?` · $${j.cost.toFixed(2)} of Claude`:""}</div></div>
      <div class="actions">
        <span class="badge s-${j.state}" style="align-self:center">${SICON[j.state]||""} ${esc(j.state)}</span>
        ${running?`<button class="btn danger" onclick="if(confirmCancel())act({action:'cancel'})">Cancel build</button>`:""}
        ${queued?`<button class="btn danger" onclick="act({action:'unqueue',job:J.id})">Remove from queue</button>`:""}
        ${!running&&!queued&&j.state!=="approval"?`<button class="btn" onclick="act({action:'retry',job:J.id})">${j.state==="done"?"Rebuild":"Retry"}</button>`:""}
        <button class="btn" onclick="act({action:'open',job:J.id})">Open folder</button>
      </div>
    </div>
    ${j.note?`<div class="sub" style="margin-top:6px">Note: ${esc(j.note)}</div>`:""}
    ${j.state==="approval"?`<div class="approve"><span>👤 <b>${esc(j.who)}</b> asked for this. It uses your footage and Claude usage.</span><span class="spacer"></span>
      <button class="btn primary" onclick="act({action:'approve',job:J.id})">Approve</button><button class="btn danger" onclick="act({action:'decline',job:J.id})">Decline</button></div>`:""}
    <div class="reqbox">${esc(j.requirements)}</div>
    <div class="steps">${steps}</div>
    ${running&&last?`<div class="now-line">Now: <strong>${esc(last.text)}</strong> · ${j.steps.length} steps so far</div>`:""}
    ${j.state==="limit"?`<div class="now-line">Claude's usage limit stopped this build. Press <strong>Retry</strong> after the reset.</div>`:""}
    ${vids.length?`<div class="section"><h4>Videos</h4><div class="vids">${vids.map((v,i)=>`
      <div class="vid"><video controls preload="metadata" playsinline src="/file?job=${encodeURIComponent(j.id)}&f=${encodeURIComponent(v.file)}"></video>
      <div class="t">V${i+1}${v.title?": "+esc(v.title):""}${v.duration_s?` <span style="color:var(--muted);font-weight:400">${v.duration_s}s</span>`:""}</div>
      ${v.concept?`<div class="c">${esc(v.concept)}</div>`:""}</div>`).join("")}</div></div>`:""}
    ${copyText?`<div class="section"><h4>Caption · keywords · hashtags</h4><div class="copy" id="copytext">${esc(copyText)}<button class="btn" onclick="copyIt()">Copy</button></div></div>`:""}
    ${(res.audio||res.posting||res.notes)?`<div class="section"><h4>Posting</h4><div class="kv">
      ${res.audio?`<div>🎵 Audio</div><div>${esc(res.audio)}</div>`:""}${res.posting?`<div>📅 When</div><div>${esc(res.posting)}</div>`:""}${res.notes?`<div>🗒️ Notes</div><div>${esc(res.notes)}</div>`:""}</div></div>`:""}
    ${j.history.length?`<div class="section"><h4>Status history</h4><div class="log">${j.history.slice().reverse().map(h=>`<div class="li"><span class="tm">${hm(h.t)}</span><span class="ic">${SICON[h.state]||"•"}</span><span class="tx">${esc(h.state)}${h.note?" · "+esc(h.note):""}</span></div>`).join("")}</div></div>`:""}
    ${j.steps.length?`<div class="section"><h4>What Claude did (${j.steps.length} steps, newest first)</h4><div class="log">${j.steps.slice().reverse().map(s=>`<div class="li ${s.k}"><span class="tm">${hm(s.t)}</span><span class="ic">${s.k==="say"?"💬":"›"}</span><span class="tx">${esc(s.text)}</span></div>`).join("")}</div></div>`:""}
  `;
  window._copy=copyText;
}
function confirmCancel(){return window.confirm("Stop this build? Partial files stay in the job folder.")}
function copyIt(){navigator.clipboard.writeText(window._copy).then(()=>toast("Copied"),()=>toast("Copy failed"))}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{mode=t.dataset.t;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
  $("#f-link").style.display=mode==="link"?"block":"none";$("#f-text").placeholder=mode==="link"?"Requirements: footage, mood, anything (e.g. use my trek footage, me in it)":"Your idea + requirements (e.g. i said i love hiking, beach version)"});
$("#f-go").onclick=async()=>{const link=mode==="link"?$("#f-link").value.trim():"",text=$("#f-text").value.trim();
  if(mode==="link"&&!link)return toast("Paste a reel link");if(mode==="idea"&&!text)return toast("Write an idea");
  await act({action:"new",link,text,versions:$("#f-v").value});$("#f-link").value="";$("#f-text").value=""};

refresh();setInterval(refresh,3000);
</script>
</body>
</html>
